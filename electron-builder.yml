appId: com.heroicgameslauncher.hgl
productName: Heroic
publish:
  provider: github
  owner: dark1ltg
  repo: Dark1HGL
  releaseType: release
files:
  - build/**/*
  - node_modules/**/*
  - '!build/bin/*'
  - build/bin/legendary.LICENSE

asarUnpack:
  - build/icon.png
  - build/icon.icns
  - build/mac-icon.icns
  - build/win_icon.ico
  - build/icon-dark.png
  - build/icon-light.png
  - build/bin/**/*
  - '!build/bin/legendary.LICENSE'
  - build/preload/webviewPreload.js

protocols:
  - name: heroic
    schemes:
      - heroic

win:
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}
  icon: build/win_icon.ico
  target:
    - nsis
  files:
    - build/bin/${arch}/win32/*
    - build/bin/x64/win32/nile.exe
    - build/bin/x64/win32/GalaxyCommunication.exe
    - build/bin/x64/win32/EpicGamesLauncher.exe

portable:
  artifactName: ${productName}-${version}-Portable-${arch}.${ext}

mac:
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}
  category: public.app-category.games
  icon: build/mac-icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    com.apple.security.cs.allow-jit: true
  files:
    - build/bin/${arch}/darwin/*
    - build/bin/x64/win32/GalaxyCommunication.exe
    - build/bin/x64/win32/EpicGamesLauncher.exe

dmg:
  background: public/dmg.png
  window:
    width: 600
    height: 500
  contents:
    - x: 10
      y: 215
      type: file
    - x: 420
      y: 215
      type: link
      path: /Applications

linux:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # Releases are the x86_64 AppImage only. Other formats stay available
  # through the dist:* scripts, which name their targets explicitly.
  target:
    - target: AppImage
      arch:
        - x64
  category: Game
  icon: build/icon.icns
  desktop:
    entry:
      # Desktop display name for this project (artifact still uses productName Heroic for updater continuity)
      Name: Dark1HGL
      Comment: Dark1HGL — GOG library folders and auto-import (Heroic-based, Linux AppImage)
      Comment[de]: Dark1HGL — GOG-Bibliotheksordner und Auto-Import (Heroic-basiert, Linux AppImage)
      Comment[pl]: Dark1HGL — foldery biblioteki GOG i auto-import (bazuje na Heroic, AppImage)
      Comment[fr]: Dark1HGL — dossiers bibliothèque GOG et auto-import (basé sur Heroic, AppImage)
      Comment[es]: Dark1HGL — carpetas de biblioteca GOG e importación automática (basado en Heroic)
      Comment[it]: Dark1HGL — cartelle libreria GOG e auto-import (basato su Heroic, AppImage)
      Comment[ru]: Dark1HGL — папки библиотеки GOG и автоимпорт (на базе Heroic, AppImage)
      Comment[zh_CN]: Dark1HGL — GOG 库文件夹与自动导入（基于 Heroic，Linux AppImage）
      Comment[pt]: Dark1HGL — pastas de biblioteca GOG e auto-importação (baseado no Heroic)
      Comment[pt_BR]: Dark1HGL — pastas de biblioteca GOG e auto-importação (baseado no Heroic)
      Comment[ja]: Dark1HGL — GOGライブラリフォルダと自動インポート（Heroicベース、AppImage）
  files:
    - build/bin/${arch}/linux/*
    - build/bin/x64/win32/GalaxyCommunication.exe
    - build/bin/x64/win32/EpicGamesLauncher.exe

rpm:
  fpm: ['--rpm-rpmbuild-define', '_build_id_links none']

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
