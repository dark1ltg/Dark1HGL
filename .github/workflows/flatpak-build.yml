on:
  push:
    branches: [main]
  pull_request:
    branches: [main, stable]
  workflow_dispatch:
    inputs:
      version:
        description: 'Build Flatpak Files'
        required: false
name: Flatpak-CI
permissions:
  contents: read
jobs:
  flatpak:
    name: 'Flatpak Build (${{ matrix.arch }})'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            electron_arch: x64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            electron_arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      - name: Test Flatpak preparation
        run: pnpm test:flatpak
      - name: Build artifacts.
        run: pnpm dist:linux --${{ matrix.electron_arch }} --dir --publish=never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare Flatpak
        run: pnpm flatpak:prepare --arch=${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runners for private repositories have much less disk space, so drop
      # everything the Flatpak build no longer needs (the app is now archived
      # in dist/, and /__t is the host's unused tool cache)
      - name: Free disk space
        run: |
          df -h .
          rm -rf node_modules build dist/*-unpacked /__t/CodeQL /__t/go /__t/PyPy /__t/Python /__t/Ruby /__t/Java_*
          df -h .
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          arch: ${{ matrix.arch }}
          bundle: heroicgameslauncher-${{ matrix.arch }}.flatpak
          manifest-path: flatpak-build/com.heroicgameslauncher.hgl.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
