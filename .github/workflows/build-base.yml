name: Build Heroic AppImages, upload artifacts
permissions:
  contents: read

on:
  workflow_call:
    secrets:
      workflowToken:
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      - name: Build AppImage version
        run: pnpm dist:linux AppImage --x64 --arm64 --publish=never
      - name: Upload AppImage x64
        uses: actions/upload-artifact@v6
        with:
          name: linux-AppImage-x64
          path: dist/Heroic*x86_64.AppImage
          retention-days: 14
          if-no-files-found: error
          compression-level: 3
      - name: Upload AppImage arm64
        uses: actions/upload-artifact@v6
        with:
          name: linux-AppImage-arm64
          path: dist/Heroic*arm64.AppImage
          retention-days: 14
          if-no-files-found: error
          compression-level: 3
