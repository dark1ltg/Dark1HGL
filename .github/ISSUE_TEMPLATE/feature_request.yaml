name: Feature request
description: Suggest something for Dark1HGL (GOG library folders / AppImage scope)
labels: feature-request
body:
  - type: markdown
    attributes:
      value: |-
        Dark1HGL scope is **GOG library folders / auto-import** and the **x86_64 Linux AppImage**.
        Epic/Amazon batch-import and multi-platform packaging are out of scope unless the project goals change ([FORK.md](https://github.com/dark1ltg/Dark1HGL/blob/main/FORK.md)).
  - type: textarea
    id: feature_problem
    attributes:
      label: Problem description
      description: If related to a problem, describe it
  - type: textarea
    id: feature_description
    attributes:
      label: Feature description
      description: What you want Dark1HGL to do
    validations:
      required: true
  - type: textarea
    id: feature_alternatives
    attributes:
      label: Alternatives
  - type: textarea
    id: additional_info
    attributes:
      label: Additional information
