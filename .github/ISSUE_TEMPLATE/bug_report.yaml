name: Bug report
description: Something broken in Dark1HGL? File it here.
labels: bug:unconfirmed
body:
  - type: markdown
    attributes:
      value: |-
        ## Dark1HGL (not official Heroic)

        This tracker is for **[dark1ltg/Dark1HGL](https://github.com/dark1ltg/Dark1HGL)** — GOG library folders / AppImage builds.

        - Game won't run under Wine/Proton? Check [upstream Heroic troubleshooting](https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/wiki/Troubleshooting) or their Discord; we may still take launcher bugs that reproduce here.
        - Attach **update.log** / **install.log** from Report a problem when the issue is a GOG download/update hang.
  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
      description: Clear description of what went wrong in Dark1HGL.
    validations:
      required: true
  - type: textarea
    id: heroic_log
    attributes:
      label: Add logs
      description: Settings → Log → copy, and/or paste update.log / install.log / launch.log from Report a problem
      render: text
    validations:
      required: true
  - type: textarea
    id: to_reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce
      value: |-
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: dark1hgl_version
    attributes:
      label: Dark1HGL / AppImage version
      description: e.g. 2.22.5-gog.5 (Help → About or the release tag you installed)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64 (AppImage)
        - Other (please describe in Additional information)
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional information
